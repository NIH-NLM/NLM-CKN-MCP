[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nlm-ckn-mcp"
version = "0.1.0"
description = "MCP server for searching the NLM Cell Knowledge Network (NLM-CKN)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  # >=1.10 guarantees the Streamable HTTP transport used for remote/web hosting.
  "mcp>=1.10.0",
  "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
cell-kg-mcp = "cell_kg_mcp.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
